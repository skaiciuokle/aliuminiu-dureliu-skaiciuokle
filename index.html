}

function downloadReport(reportType) {
    const token = getOrRequestSecretToken();
    if (!token) return;

    const startDate = document.getElementById('report-start-date').value;
    const endDate = document.getElementById('report-end-date').value;

    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ 
            action: "generateReport", 
            secretToken: token, 
            reportType: reportType, 
            startDate: startDate, 
            endDate: endDate 
        })
    })
    .then(res => res.text())
    .then(csvText => {
        const blob = new Blob(["\ufeff" + csvText], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${reportType}_ataskaita_${startDate}_iki_${endDate}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    })
    .catch(err => {
        console.error("Klaida siunčiant ataskaitos užklausą:", err);
        alert("Klaida generuojant ataskaitą.");
    });
}

            action: "saveData",
            secretToken: secretToken,
            orderDate: formattedDate,
            clientName: `${clientName} ${clientPhone ? '(' + clientPhone + ')' : ''}`,
            city: selectedCity,
            height: item.height,
            width: item.width,

            doorGlass: item.doorGlass,
            doorGlassDims: item.doorGlassDims,
            shelfGlass: item.shelfGlass,

            shelfDims: item.shelfDims,
            shelfQty: item.shelfQty,
            shelfEdges: item.shelfEdges,
            configJson: item.configJson
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .catch(err => console.error("Klaida siunčiant į Google Sheets:", err));
    });
}

function printOrder() {
    let itemsToPrint = orderCart.length > 0 ? [...orderCart] : [gatherCurrentConfigData()];
    executePrintWindow(itemsToPrint, document.getElementById('client-name').value.trim() || 'Klientas', document.getElementById('client-phone').value.trim(), document.getElementById('miestas').value, getFormattedDisplayDate());
}

function printSpecificOrderFromBoard(encodedOrdStr) {
    const ord = JSON.parse(decodeURIComponent(encodedOrdStr));
    
    let simulatedItem = {
        profileText: ord.profile || '',
        dimsShortTxt: `${ord.height || 0}x${ord.width || 0} mm`,
        totalPrice: parseFloat(ord.price || 0),
        summaryHtml: ''
    };

    if (ord.configJson) {
        try {
            const cfg = JSON.parse(ord.configJson);
            const scale = Math.min(250 / Math.max(1, cfg.w, cfg.mirror ? cfg.wMirror : 0), 320 / Math.max(1, cfg.h, cfg.mirror ? cfg.hMirror : 0));
            
            const tempDiv = document.createElement('div');
            tempDiv.style.display = 'flex';
            tempDiv.style.gap = '20px';
            tempDiv.style.alignItems = 'flex-start';

            tempDiv.appendChild(createDrawing('Pagrindinė ('+cfg.mainSide+')', 'main', cfg.w, cfg.h, scale, cfg.mainSide, cfg.hinges, cfg.qtyMain, 'qtyMain', cfg.handleInfo, cfg.millingHandleInfo));
            if (cfg.mirror) {
                const otherSide = cfg.mainSide === 'kaire' ? 'desine' : 'kaire';
                tempDiv.appendChild(createDrawing('Veidrodinė ('+otherSide+')', 'mirror', cfg.wMirror, cfg.hMirror, scale, otherSide, cfg.hinges, cfg.qtyMirror, 'qtyMirror', cfg.handleInfo, cfg.millingHandleInfo));
            }

            simulatedItem.summaryHtml = cfg.summaryContent.split('<div style="display:flex;')[0] + `<div style="display:flex; gap:15px; justify-content:center; margin-top:15px; flex-wrap:wrap;">${tempDiv.innerHTML}</div>`;
        } catch (e) {
            console.error("Klaida atkuriant brėžinį iš JSON:", e);
            simulatedItem.summaryHtml = `<div class="result-card"><p>Brėžinio nepavyko atkurti.</p></div>`;
        }
    } else {
        simulatedItem.summaryHtml = `
            <div class="result-card">
                <table class="result-table">
                    <tr><td><b>Klientas:</b> ${ord.client || ''}</td><td style="text-align:right;"><b>Miestas:</b> ${ord.city || ''}</td></tr>
                    <tr><td><b>Data:</b> ${ord.date || ''}</td><td style="text-align:right;"><b>Kiekis:</b> ${ord.quantity || 0} vnt.</td></tr>
                    <tr><td colspan="2"><b>Profilis:</b> ${ord.profile || ''}</td></tr>
                    <tr><td colspan="2"><b>Gaminio dydis:</b> <b>${ord.height || 0} x ${ord.width || 0} mm</b></td></tr>
                    <tr><td colspan="2"><b>Stiklas:</b> ${ord.doorGlass || 'Nėra'} (${ord.doorGlassDims || ''})</td></tr>
                    <tr><td colspan="2"><b>Lentynėlės:</b> ${ord.shelfInfo || 'Nėra'}</td></tr>
                    <tr><td colspan="2" style="text-align:right; padding-top:6px; border-top: 2px solid #2ecc71;" class="total-price">Viso: ${parseFloat(ord.price || 0).toFixed(2)} €</td></tr>
                </table>
            </div>
        `;
    }

    executePrintWindow([simulatedItem], ord.client || 'Klientas', '', ord.city || '', ord.date || '');
}
